services:
  - type: web
    name: sidequest
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.11.1
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sidequest
      - key: GEMMA_BASE_URL
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
