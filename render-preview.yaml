# Explicit disposable preview. Use render.yaml with Atlas for durable hosting.
services:
  - type: web
    name: sidequest
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.11.1
      - key: ALLOW_EPHEMERAL_DEMO
        value: 'true'
